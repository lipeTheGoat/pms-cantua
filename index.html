<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cantuá · Reservas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20260918b" />
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <img src="Logo.png" alt="Cantuá" class="logo-img">
    <span class="prop-name" id="propName">Cantuá</span>
  </div>
  <nav class="tabs" id="navTabs">
    <button class="tab active" data-view="mapa">Reservas</button>
    <button class="tab" data-view="emcasa">Hóspedes</button>
    <button class="tab" data-view="config">Configurações</button>
  </nav>
  <div class="topbar-right">
    <span class="sync-status" id="syncStatus"></span>
    <div class="user-chip">
      <span class="user-avatar">EC</span>
      <span class="user-label">Olá, Equipe Cantuá</span>
      <svg class="user-caret" viewBox="0 0 16 16" width="12" height="12"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
  </div>
</header>

<main id="app"></main>

<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

<div class="bar-tooltip hidden" id="barTooltip"></div>

<div class="toast" id="toast"></div>

<script type="module" src="app.js?v=20260918b"></script>

</html>
